# nginx config for the production frontend.
#
# Goals:
#  1. Serve /usr/share/nginx/html as the SPA root.
#  2. Reverse-proxy /api/* to the FastAPI service. The browser only
#     sees a single origin in production, so no CORS dance.
#  3. SPA fallback: any unknown path serves index.html so React Router
#     can take over.
#  4. Cache hashed assets aggressively; never cache index.html.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text-ish assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Long-cache the hashed bundles emitted by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy. "web" is the FastAPI service name in
    # docker-compose.yml. The /api prefix is stripped before forwarding.
    location /api/ {
        proxy_pass http://web:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE needs flushing and no buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Don't cache the SPA shell so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
